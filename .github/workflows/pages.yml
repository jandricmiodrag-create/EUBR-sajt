name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Automatski regeneriši indeks baze znanja iz data/kb/*.md
      # (tako je dovoljno dodati .md fajl preko GitHub-a — bez lokalnog build-a)
      - name: Build knowledge base index
        run: python3 data/build-kb.py

      # Sklopi čist _site (bez .git/.github); GitHub Pages servira 404.html
      # za nepoznate putanje — to je kopija index.html, pa ruter preuzme rutiranje.
      - name: Assemble site (+ base path + SPA 404 fallback)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          # Pages servira projekat na /<repo>/ — prepiši base putanju
          sed -i 's#<base href="/">#<base href="/${{ github.event.repository.name }}/">#' _site/index.html
          cp _site/index.html _site/404.html

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
